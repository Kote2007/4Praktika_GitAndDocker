name: CI

on:
  push:
    branches: [main]
    tags:
      - "*"
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  IMAGE: python:3.11.10-slim
  APP_PORT: ${{ vars.APP_PORT || '8106' }}

jobs:
  validate:
    name: validate
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python version and commit
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GITHUB_SHA \
            -e GITHUB_RUN_ID \
            -e APP_PORT \
            "$IMAGE" \
            bash -c 'python --version; echo "commit=$GITHUB_SHA"; echo "run_id=$GITHUB_RUN_ID"; echo "app_port=$APP_PORT"'

      - name: Compile all Python files
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            "$IMAGE" \
            python -m compileall -q .

      - name: Check UTF-8
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            "$IMAGE" \
            python scripts/check_utf8.py

  unit_tests:
    name: test
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONPATH=. \
            "$IMAGE" \
            python -m unittest discover -s tests -v

  package:
    name: package
    needs: unit_tests
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dist and manifest
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GITHUB_SHA \
            -e GITHUB_RUN_ID \
            "$IMAGE" \
            python scripts/package.py

      - name: Show dist content
        run: ls -la dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy_test:
    name: deploy_test
    needs: package
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    environment:
      name: test/attendance
      url: https://example.com/test/attendance

    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist-download

      - name: Check DEPLOY_TOKEN without printing it
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "DEPLOY_TOKEN is not set"
            exit 1
          fi

          echo "DEPLOY_TOKEN is present, length=${#DEPLOY_TOKEN}"
          echo "APP_PORT=$APP_PORT"

      - name: Copy artifact to deploy/test
        run: |
          mkdir -p deploy/test
          cp -r dist-download/. deploy/test/
          ls -la deploy/test

      - name: Smoke check crossing midnight
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            "$IMAGE" \
            python scripts/smoke_deploy.py deploy/test

      - name: Save deployment report
        run: |
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "environment=test/attendance"
            echo "app_port=$APP_PORT"
            echo "smoke=OK"
            echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > deployment.txt

          cat deployment.txt

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deployment.txt
          retention-days: 7